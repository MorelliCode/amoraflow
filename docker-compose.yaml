services:
  db:
    image: postgres:17                # same major version as production
    environment:
      POSTGRES_DB: amoraflow
      POSTGRES_USER: amoraflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devonly}   # never reuse in production
    ports:
      - "127.0.0.1:5432:5432"         # loopback, not 0.0.0.0
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amoraflow -d amoraflow"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
