[project]
name = "amoraflow"
version = "0.1.0"
requires-python = ">=3.13.18"
dependencies = [
    "django~=6.1.3",
    "django-htmx~=1.29.0",
    "django-phonenumber-field[phonenumbers]~=9.0.0",
    "gunicorn~=27.0.1",
    "pillow~=13.0.0",
    "psycopg[binary]~=3.3.9",
    "python-dotenv~=1.2.4",
]

[dependency-groups]
dev = [
    "django-browser-reload~=1.21.0",
    "django-debug-toolbar~=8.0.0",
    "django-stubs~=6.1.2",
    "djlint~=1.50.1",
    "mypy~=2.4.1",
    "pre-commit~=4.7.0",
    "pytest~=9.2.0",
    "pytest-cov~=7.1.0",
    "pytest-django~=4.14.0",
    "ruff~=0.17.5",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"

[tool.ruff]
extend-exclude = ["*/migrations/"]
